<div class="tab-pane fade show active" id="chat" role="tabpanel">
  <div class="chat-wrap">

    <!-- Avatar (click to toggle) -->
    <div class="avatar-header" id="avatarHeader" role="button" tabindex="0" aria-expanded="true" aria-label="Toggle character panel">
      <img id="backgroundImage" src="" alt="Avatar">
      <div class="avatar-glow"></div>
      <div class="t95-chat-identity"><span>COMMUNICATIONS / 01</span><strong>{{ char_name }}</strong><small>TEXT + VOICE INTERFACE</small></div>
      <span class="t95-avatar-hint">CHARACTER PANEL / TOGGLE</span>
    </div>

    <div class="t95-chat-log-header"><span>CONVERSATION LOG</span><span id="chatActivity" role="status" aria-live="polite">READY</span></div>

    <!-- Messages -->
    <div class="chat-body" id="chatBody">
      <div class="chat-messages" id="chatMessages">
        <div class="msg-row msg-bot">
          <div class="msg-meta">
            <span class="msg-name" id="bot-name">{{ char_name }}</span>
          </div>
          <div class="msg-bubble msg-bubble-bot">
            <p class="firstmess" id="bot-firstmess">{{ char_greeting }}</p>
          </div>
        </div>
        <div id="output"></div>
      </div>
    </div>

    <!-- Hidden upload form -->
    <form id="imageUploadForm" method="POST" enctype="multipart/form-data" action="/process_llm" hidden>
      <input type="file" id="imageUpload" name="file" accept="image/*">
    </form>

    <!-- Image preview -->
    <div id="imagePreviewContainer">
      <img id="imagePreview" src="" alt="Preview">
      <button id="removeImageButton" aria-label="Remove image"><i class="bi bi-x"></i></button>
    </div>

    <!-- Input bar -->
    <div class="chat-input-bar" id="chatInputBar">
      <div class="input-pill">
        <button id="uploadImageButton" aria-label="Upload image"><i class="bi bi-plus-lg"></i></button>
        <input type="text" id="prompt" aria-label="Message" placeholder="Send a message…" autocomplete="off" />
        <div class="voice-overlay" id="voiceOverlay" style="display:none;">
          <canvas id="voiceWaveform" height="40"></canvas>
          <span class="voice-status" id="voiceStatus" role="status" aria-live="polite"></span>
        </div>
      </div>
      <button id="muteButton" aria-label="Unmute audio" aria-pressed="true"><i class="bi bi-volume-mute-fill"></i><span class="t95-control-label" id="audioButtonLabel">MUTED</span></button>
      <button id="voiceModeButton" aria-label="Voice mode"><i class="bi bi-mic-fill"></i><span class="t95-control-label" id="voiceButtonLabel">VOICE</span></button>
    </div>

  </div>
</div>
